spring.application.name=smpp-server-instance-01
server.ip=127.0.0.1
server.port=9988
instance.initial.status=STARTED
instance.protocol=SMPP

# Redis Cluster and queues
redis.cluster.nodes=localhost:6379
redis.threadPool.maxTotal=60
redis.threadPool.maxIdle=50
redis.threadPool.minIdle=10
redis.threadPool.blockWhenExhausted=true
redis.connection.timeout=2000
redis.so.timeout=2000
redis.maxAttempts=20
redis.connection.user=
redis.connection.password=
redis.standalone.enabled=true

# WebSocket server configurations
websocket.server.enabled=true
websocket.server.host=localhost
websocket.server.port=8080
websocket.server.path=/ws

# unit of measurements seconds
websocket.retry.intervalSeconds=10
websocket.header.name=Authorization
websocket.header.value=fcb13146-ecd7-46a5-b9cb-a1e75fae9bdc

# Configuration for the virtual threads
spring.threads.virtual.enabled=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094
spring.kafka.listener.concurrency=30
spring.kafka.consumer.reconnect.backoff.ms=1000
spring.kafka.consumer.reconnect.backoff.max.ms=10000
spring.kafka.consumer.session.timeout.ms=30000
spring.kafka.consumer.heartbeat.interval.ms=10000
spring.kafka.producer.reconnect.backoff.ms=1000
spring.kafka.producer.reconnect.backoff.max.ms=10000

# Scylla
scylla.contact.points=localhost:9042
scylla.datacenter=datacenter1
scylla.user=
scylla.password=

# Rate Limiter
server.rate.limiter.kafka.emit=false

# Message Parts TTL Configuration
message.parts.ttl=30


# Bind notification publishing to Kafka
bind.notification.enabled=false

# Pending DLR Cache Configuration — maximum entries per service provider (evicts oldest when exceeded)
pending.dlr.cache.maximumSize=100000
# Set to false to disable caching of undeliverable DLRs (they will be dropped when SP is unbound)
pending.dlr.cache.enabled=true

# TLS keystore configuration for SMPP over TLS
smpp.server.tls.keystore.path=
smpp.server.tls.keystore.password=

proxy.mode.responseTimeout=5000